appId: com.sml1145.huanxiangshike
productName: 幻想时刻
copyright: Copyright © 2026 sml1145

# 安装包文件名用 ASCII，避免 electron-updater 解析 latest.yml 时出现编码问题
artifactName: HuanXiangShiKe-Setup-${version}.${ext}

directories:
  output: release
  buildResources: build

files:
  - package.json
  - models.json
  - src/**/*
  - "!**/*.map"
  - "!**/*.md"

# ffmpeg 是原生二进制，必须解包到 asar 之外才能被执行
asar: true
asarUnpack:
  - node_modules/@ffmpeg-installer/**

# 本地推理的 Python 脚本以纯文本资源形式随包分发，同样解包
extraResources:
  - from: src/local
    to: local
    filter:
      - "**/*.py"
      - "**/*.txt"
      - "**/*.json"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 未购买代码签名证书。注意必须用 signExecutable:false 而非 signAndEditExecutable:false——
  # 后者会连带跳过图标与版本元数据写入（app-builder-lib winPackager.js 明确提示），
  # 导致 exe 无图标。signExecutable:false 只跳过签名，保留图标/元数据。
  signExecutable: false

nsis:
  oneClick: false
  # per-user 安装到 %LOCALAPPDATA%\Programs\幻想时刻 —— 免 UAC，静默升级不弹管理员框
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 幻想时刻
  deleteAppDataOnUninstall: false
  # 生成 blockmap，支持 electron-updater 差分更新
  differentialPackage: true

publish:
  provider: github
  owner: sml1145
  repo: AIshipin
  releaseType: release
